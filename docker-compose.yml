version: '3.9'

services:
  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      APP_API_BASE_URL: http://host.docker.internal:5000
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_TIMEOUTMS: 30000
    command: >
      bash -lc "dotnet restore && dotnet test --logger \"trx;LogFileName=test-results.trx\" --results-directory TestResults"
